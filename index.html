<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONOS - Verificador Criptográfico</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { background: #111; border: 1px solid #00ff00; padding: 40px; width: 90%; max-width: 500px; text-align: center; }
        h1 { font-size: 18px; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        .status { font-size: 48px; font-weight: bold; margin: 20px 0; }
        .valid { color: #00ff00; }
        .invalid { color: #ff0000; }
        .folio { font-size: 14px; background: #000; padding: 10px; margin-top: 10px; word-break: break-all; }
        #hash_result { font-size: 12px; margin-top: 15px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>SISTEMA DE INTEGRIDAD KRONOS</h1>
        <div id="status_display" class="status">ESCANEANDO...</div>
        <div id="folio_display" class="folio">Folio: Cargando...</div>
        <div id="hash_result"></div>
        <div style="margin-top:20px;font-size:10px;opacity:0.5;">VERIFICACIÓN LOCAL SIN INTERNET</div>
    </div>

    <script>
        // El hash real de tu certificado. CAMBIA ESTO POR TU HASH SHA-256 REAL.
        const HASH_MAESTRO = "a7f3c9d2e8b1f4a6c0d3e5b8a9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verificar() {
            const urlParams = new URLSearchParams(window.location.search);
            const folio = urlParams.get('folio') || 'KRN-JELIEL-02-72';
            
            document.getElementById('folio_display').innerText = "Folio: " + folio;

            // Calculamos el hash local del folio
            const hashCalculado = await sha256(folio);
            document.getElementById('hash_result').innerText = "HASH CALCULADO: " + hashCalculado;

            const statusDiv = document.getElementById('status_display');
            if (hashCalculado === HASH_MAESTRO) {
                statusDiv.innerText = "VERDE 0";
                statusDiv.className = "status valid";
            } else {
                statusDiv.innerText = "ROJO 1";
                statusDiv.className = "status invalid";
            }
        }
        verificar();
    </script>
</body>
</html>
