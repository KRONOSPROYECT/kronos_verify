<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONOS - Blindaje Temporal Cuántico</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { background: #111; border: 2px solid #00ff00; padding: 40px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        h1 { font-size: 18px; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        .status { font-size: 42px; font-weight: bold; margin: 20px 0; }
        .valid { color: #00ff00; }
        .invalid { color: #ff0000; }
        .folio { font-size: 14px; background: #000; padding: 10px; margin-top: 10px; word-break: break-all; border: 1px solid #333; }
        #hash_result { font-size: 10px; margin-top: 15px; opacity: 0.7; color: #aaa; }
        .lunar-day { font-size: 12px; color: #FFD700; margin-bottom: 10px; }
        .window { font-size: 11px; color: #FFD700; margin-top: 5px; }
        .footer { margin-top:20px;font-size:10px;opacity:0.5; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>PROTOCOLO MEM-SHIN (13-21)</h1>
        <div id="lunar_display" class="lunar-day">FASE LUNAR: CARGANDO...</div>
        <div id="status_display" class="status">ESCANEANDO...</div>
        <div id="folio_display" class="folio">Folio: Cargando...</div>
        <div id="hash_result"></div>
        <div class="window" id="window_display">VENTANA ASTRONÓMICA: CERRADA</div>
        <div class="footer">VERIFICACIÓN OFFLINE • ANCLAJE HÍBRIDO</div>
    </div>

    <script>
        const FOLIO_BASE = "KRN-JELIEL-02-72";
        // <--- ESTO LO CAMBIARÁS EN EL PASO 2
        const HASH_CUANTICO_MAESTRO = "PEGA_AQUI_TU_HASH_DE_64_CARACTERES"; 

        function getLunarDay() {
            const knownNewMoon = new Date(2000, 0, 6).getTime();
            const now = new Date().getTime();
            const diffDays = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
            return Math.floor((diffDays % 29.530588) + 1);
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verificar() {
            const urlParams = new URLSearchParams(window.location.search);
            const folio = urlParams.get('folio') || FOLIO_BASE;
            const diaLunar = getLunarDay();
            
            document.getElementById('lunar_display').innerText = `FASE LUNAR: DÍA ${diaLunar} / 29.5`;
            document.getElementById('folio_display').innerText = "Folio: " + folio;

            const ventanaAbierta = (diaLunar >= 13 && diaLunar <= 21);
            const windowDiv = document.getElementById('window_display');
            const statusDiv = document.getElementById('status_display');

            if (!ventanaAbierta) {
                windowDiv.innerText = "VENTANA ASTRONÓMICA: CERRADA";
                statusDiv.innerText = "ROJO 1 - BLOQUEADO";
                statusDiv.className = "status invalid";
                document.getElementById('hash_result').innerText = "ERROR: FUERA DE VENTANA CÓSMICA";
                return;
            }

            windowDiv.innerText = "VENTANA ASTRONÓMICA: ABIERTA 🔓";
            const semillaHibrida = folio + '-' + diaLunar;
            const hashCalculado = await sha256(semillaHibrida);
            document.getElementById('hash_result').innerText = `HASH (Luna ${diaLunar}): ${hashCalculado}`;

            if (hashCalculado === HASH_CUANTICO_MAESTRO) {
                statusDiv.innerText = "VERDE 0 - SELLADO";
                statusDiv.className = "status valid";
            } else {
                statusDiv.innerText = "ROJO 1 - FALSO";
                statusDiv.className = "status invalid";
            }
        }
        verificar();
    </script>
</body>
</html>
